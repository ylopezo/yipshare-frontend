services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        API_URL: yipshare-backend.oelohey.dev
    restart: unless-stopped
    environment:
      - API_URL=yipshare-backend.oelohey.dev
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - default
      - proxy_net

networks:
  proxy_net:
    name: app-stack_web_network
    external: true
